name: GoTech Desk test Windows machine

# Spins up a throwaway Windows runner with GoTech Desk installed and registered
# to a customer number, so the panel's connect flow can be tested without a PC.
on:
  workflow_dispatch:
    inputs:
      customer_code:
        description: "Firma kodu"
        default: "799990"
        required: true
      minutes:
        description: "Açık kalma süresi (dakika)"
        default: "45"
        required: true
      label:
        description: "Ortak bilgisayar etiketi (boşsa ilk kişiye bağlanır)"
        default: ""
        required: false
      support_request:
        description: "Açılışta destek talebi oluştur"
        default: "true"
        required: true
      installer_url:
        description: "MSI adresi"
        default: "https://github.com/WeAreGoTech/gotech-desk/releases/download/gotech-1.5.0-test3/GoTechDesk-1.5.0-x86_64.msi"
        required: true

env:
  PANEL_URL: "https://gotech-web-31-40-199-183.sslip.io"

jobs:
  test-machine:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Install GoTech Desk
        run: |
          Invoke-WebRequest -Uri "${{ inputs.installer_url }}" -OutFile gotech.msi
          $p = Start-Process msiexec.exe -ArgumentList '/i gotech.msi /qn /norestart /l*v msi.log' -Wait -PassThru
          Write-Output "msiexec exit code: $($p.ExitCode)"
          Get-ChildItem "C:\Program Files\GoTechDesk" | Select-Object -First 10
          Get-Service | Where-Object { $_.Name -like "*GoTech*" } | Format-Table -AutoSize

      - name: Start service and read ID
        run: |
          $exe = "C:\Program Files\GoTechDesk\GoTechDesk.exe"
          Start-Service -Name GoTechDesk -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 30
          $id = ""
          for ($i = 0; $i -lt 12 -and -not $id; $i++) {
            $id = (& $exe --get-id | Out-String).Trim()
            if (-not $id) { Start-Sleep -Seconds 10 }
          }
          if (-not $id) { Write-Error "Could not read GoTech Desk ID"; exit 1 }
          Write-Output "GoTech Desk ID: $id"
          "DESK_ID=$id" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set unattended password and register to panel
        run: |
          $exe = "C:\Program Files\GoTechDesk\GoTechDesk.exe"
          $chars = [char[]]'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'
          $pw = -join (1..20 | ForEach-Object { $chars | Get-Random })
          & $exe --password $pw | Out-Null
          Start-Sleep -Seconds 5
          function Post($path, $obj) {
            $json = $obj | ConvertTo-Json
            Invoke-RestMethod -Method Post -Uri "$env:PANEL_URL$path" -ContentType "application/json; charset=utf-8" -Body ([System.Text.Encoding]::UTF8.GetBytes($json))
          }
          $lookup = Post "/api/desk/lookup" @{ customerCode = "${{ inputs.customer_code }}" }
          Write-Output "Firma: $($lookup.companyName), kişi sayısı: $($lookup.people.Count)"
          $reg = @{
            customerCode = "${{ inputs.customer_code }}"
            deskId = $env:DESK_ID
            hostname = "BULUT-TEST-PC"
            platform = "windows"
            appVersion = "1.5.0"
            unattendedPassword = $pw
            personId = $null
            personName = $null
            label = $null
          }
          if ("${{ inputs.label }}") { $reg.label = "${{ inputs.label }}" }
          elseif ($lookup.people.Count -gt 0) { $reg.personId = $lookup.people[0].id }
          else { $reg.personName = "Bulut Test Kullanıcısı" }
          $resp = Post "/api/desk/register" $reg
          Write-Output "::add-mask::$($resp.deviceToken)"
          Write-Output "Kayıt: $($resp.companyName) / kişi: $($resp.personName) / etiket: $($resp.label)"
          "DESK_TOKEN=$($resp.deviceToken)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Open a support ticket from the machine
        if: ${{ inputs.support_request == 'true' }}
        run: |
          $json = @{ deskId = $env:DESK_ID; deviceToken = $env:DESK_TOKEN; message = "Bulut test makinesinden deneme destek talebi." } | ConvertTo-Json
          $resp = Invoke-RestMethod -Method Post -Uri "$env:PANEL_URL/api/desk/support-request" -ContentType "application/json; charset=utf-8" -Body ([System.Text.Encoding]::UTF8.GetBytes($json))
          Write-Output "Talep açıldı: #$($resp.ticketNumber)"

      - name: Keep machine online
        run: |
          $end = (Get-Date).AddMinutes([int]"${{ inputs.minutes }}")
          while ((Get-Date) -lt $end) {
            $left = [int](($end - (Get-Date)).TotalMinutes)
            Write-Output "$(Get-Date -Format HH:mm) ID $env:DESK_ID açık, kalan ~$left dk"
            Start-Sleep -Seconds 60
          }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-machine-logs
          path: |
            msi.log
            C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\GoTechDesk\log\**
